# Quick connect relay: modest rate limit per client
limit_req_zone $binary_remote_addr zone=pagerr_relay:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Quick connect relay (tiny in-memory mailbox for encrypted device-to-device sync).
    # If the relay is not running, this returns 502 and Pagerr simply hides Quick connect.
    location /pagerr-relay/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        client_max_body_size 600k;
        limit_req zone=pagerr_relay burst=30 nodelay;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src data:; img-src * data: blob:; script-src 'self' 'unsafe-inline'; connect-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'self';" always;

    # If you serve Pagerr over HTTPS (e.g. behind Traefik/Caddy), also send HSTS
    # from the reverse proxy:  Strict-Transport-Security: max-age=31536000

    # Disable access log for favicon/robots to keep logs clean
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript;
}
