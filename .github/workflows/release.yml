name: Release

# Publishes a GitHub Release and version-tagged multi-architecture Docker images (3.0.0, 3.0, 3) whenever
# you push a version tag such as v3.0.0. The `latest` tag is still built by docker-build.yml on every push to main. Requires two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with Read & Write permission).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q -- '-'; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^---$/ { next }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then echo "See CHANGELOG.md for details." > release_notes.md; fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mortaljinx/pagerr:${{ steps.ver.outputs.version }}
            ${{ steps.ver.outputs.prerelease == 'false' && format('mortaljinx/pagerr:{0}', steps.ver.outputs.minor) || '' }}
            ${{ steps.ver.outputs.prerelease == 'false' && format('mortaljinx/pagerr:{0}', steps.ver.outputs.major) || '' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pagerr ${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
